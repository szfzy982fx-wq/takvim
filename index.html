<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPA - Takvim ve Ajanda Yönetimi</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #2c3e50; 
            --accent: #e67e22; 
            --bg: #eef2f3; 
            --red: #c0392b;
            --blue: #2980b9;
            --green: #27ae60;
        }

        body { background-color: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif; color: var(--primary); padding: 15px; }
        
        .header-title { color: var(--primary); font-weight: 900; font-size: 1.5rem; border-bottom: 3px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; text-transform: uppercase; }
        
        .card-custom { background: #fff; border-radius: 12px; border: 1px solid #ddd; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 20px; }
        .form-label { font-weight: 700; font-size: 0.8rem; color: #7f8c8d; text-transform: uppercase; margin-bottom: 4px;}
        .form-control, .form-select { border-radius: 8px; border: 2px solid #e2e8f0; font-weight: 600; color: #2c3e50; }
        .form-control:focus, .form-select:focus { border-color: var(--accent); box-shadow: none; }
        
        /* Renk Seçiciler */
        .color-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .color-btn { flex: 1; padding: 10px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; text-align: center; font-weight: bold; color: white; transition: 0.2s; }
        .color-btn.red { background: var(--red); opacity: 0.6; }
        .color-btn.blue { background: var(--blue); opacity: 0.6; }
        .color-btn.green { background: var(--green); opacity: 0.6; }
        .color-btn.active { opacity: 1; transform: scale(1.05); border-color: #2c3e50; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

        .btn-save { background: var(--primary); color: white; font-weight: bold; border-radius: 8px; padding: 12px; width: 100%; transition: 0.2s; }
        .btn-save:hover { background: #1a252f; color: white; }

        /* Ajanda Listesi */
        .agenda-list { max-height: 70vh; overflow-y: auto; padding-right: 5px; }
        .agenda-item { background: #fdfdfd; border-left: 5px solid; border-radius: 8px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border-top: 1px solid #eee; border-right: 1px solid #eee; border-bottom: 1px solid #eee; }
        .agenda-item:hover { transform: translateX(3px); background: #f8f9fa; }
        .agenda-item.cat-red { border-left-color: var(--red); }
        .agenda-item.cat-blue { border-left-color: var(--blue); }
        .agenda-item.cat-green { border-left-color: var(--green); }
        
        .agenda-time { font-size: 1.1rem; font-weight: 900; color: #2c3e50; }
        .agenda-date { font-size: 0.75rem; color: #7f8c8d; font-weight: bold; }
        .agenda-subject { font-size: 0.95rem; font-weight: 700; margin: 4px 0; }
        .agenda-meta { font-size: 0.7rem; color: #95a5a6; display: flex; gap: 8px; }
        
        .btn-action { background: none; border: none; font-size: 1.1rem; cursor: pointer; transition: 0.2s; padding: 5px; }
        .btn-action.del { color: var(--red); }
        .btn-action.gcal { color: #f39c12; }
        .btn-action:hover { transform: scale(1.2); }

        /* Alarm Modalı (Büyük Kutu) */
        .alarm-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.9); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .alarm-box { background: white; width: 90%; max-width: 500px; border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; }
        .alarm-box::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 10px; background: var(--accent); animation: pulseColor 1s infinite alternate; }
        
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulseColor { 0% { background: var(--accent); } 100% { background: var(--red); } }
        @keyframes bellShake { 0% { transform: rotate(0); } 20% { transform: rotate(15deg); } 40% { transform: rotate(-15deg); } 60% { transform: rotate(10deg); } 80% { transform: rotate(-10deg); } 100% { transform: rotate(0); } }

        .alarm-icon { font-size: 4rem; color: var(--accent); margin-bottom: 15px; animation: bellShake 2s infinite ease-in-out; }
        .alarm-subject { font-size: 1.8rem; font-weight: 900; color: var(--primary); margin-bottom: 10px; }
        .alarm-time { font-size: 1.2rem; color: #7f8c8d; font-weight: 700; margin-bottom: 25px; }
        
        .alarm-btns { display: flex; gap: 15px; }
        .btn-stop { flex: 1; background: var(--green); color: white; padding: 15px; font-size: 1.1rem; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; transition: 0.2s; }
        .btn-stop:hover { background: #219653; transform: translateY(-2px); }
        .btn-snooze { flex: 1; background: #f39c12; color: white; padding: 15px; font-size: 1.1rem; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; transition: 0.2s; }
        .btn-snooze:hover { background: #d68910; transform: translateY(-2px); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #bdc3c7; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="header-title">
        <i class="fa-regular fa-calendar-check" style="color: var(--accent);"></i> Ajanda & Görev Yönetimi
        <button class="btn btn-sm btn-outline-secondary float-end" onclick="requestNotificationPermission()" style="font-size:0.7rem; font-weight:bold;">
            <i class="fa-solid fa-bell"></i> Bildirimlere İzin Ver
        </button>
    </div>

    <div class="row">
        <div class="col-lg-5">
            <div class="card-custom">
                <h5 style="color: var(--primary); font-weight: 800; margin-bottom: 20px;"><i class="fa-solid fa-plus-circle"></i> Yeni Etkinlik / Alarm Kur</h5>
                
                <div class="mb-3">
                    <label class="form-label">Konu / Açıklama</label>
                    <input type="text" id="evSubject" class="form-control" placeholder="Örn: X Projesi Tapu Randevusu">
                </div>

                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label">Tarih ve Saat</label>
                        <input type="datetime-local" id="evDateTime" class="form-control">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Ön Hatırlatıcı (Erken Uyarı)</label>
                        <select id="evPreAlarm" class="form-select">
                            <option value="0">Tam Vaktinde Çal</option>
                            <option value="15">15 Dakika Önce</option>
                            <option value="60">1 Saat Önce</option>
                            <option value="1440">1 Gün Önce</option>
                        </select>
                    </div>
                </div>

                <label class="form-label">Renk Kodlaması (Kategori)</label>
                <div class="color-selector">
                    <div class="color-btn red active" onclick="selectColor('red')">Tapu / Acil</div>
                    <div class="color-btn blue" onclick="selectColor('blue')">Randevu / Sunum</div>
                    <div class="color-btn green" onclick="selectColor('green')">Arama / Not</div>
                </div>

                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label">Tekrarlama Düzeni</label>
                        <select id="evRecurType" class="form-select" onchange="updateRecurInterval()">
                            <option value="none">Tekrar Etme (Sadece 1 Kez)</option>
                            <option value="daily">Günlük</option>
                            <option value="weekly">Haftalık</option>
                            <option value="monthly">Aylık</option>
                            <option value="yearly">Yıllık</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Sıklık</label>
                        <select id="evRecurInterval" class="form-select" disabled>
                            <option value="1">Her ...</option>
                        </select>
                    </div>
                </div>

                <button class="btn btn-save" onclick="saveEvent()"><i class="fa-solid fa-floppy-disk"></i> ALARMI KAYDET</button>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card-custom">
                <h5 style="color: var(--primary); font-weight: 800; margin-bottom: 20px;"><i class="fa-solid fa-list-check"></i> Yaklaşanlar ve Bugün</h5>
                <div id="agendaContainer" class="agenda-list">
                    </div>
            </div>
        </div>
    </div>
</div>

<div id="alarmOverlay" class="alarm-overlay">
    <div class="alarm-box">
        <i class="fa-solid fa-bell alarm-icon"></i>
        <div id="alarmSubject" class="alarm-subject">Tapu Randevusu</div>
        <div id="alarmTimeText" class="alarm-time">Zamanı Geldi: 14:30</div>
        
        <div class="alarm-btns">
            <button class="btn-snooze" onclick="snoozeAlarm()"><i class="fa-solid fa-clock-rotate-left"></i> ERTELE<br><span style="font-size:0.7rem;">(1 Saat Sonra)</span></button>
            <button class="btn-stop" onclick="stopAlarm()"><i class="fa-solid fa-check-double"></i> DURDUR<br><span style="font-size:0.7rem;">(Görev Tamamlandı)</span></button>
        </div>
    </div>
</div>

<audio id="alarmSound" src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU... (Bu kısım yerel tarayıcı sesiyle sentezlenecektir)" preload="auto"></audio>

<script>
    let events = JSON.parse(localStorage.getItem('epa_calendar_events')) || [];
    let selectedColor = 'red';
    let activeAlarmId = null;
    let alarmCheckInterval = null;

    // Renk Seçimi
    function selectColor(color) {
        selectedColor = color;
        document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.color-btn.${color}`).classList.add('active');
    }

    // Tekrarlama Seçeneklerini Dinamik Güncelleme
    function updateRecurInterval() {
        let type = document.getElementById('evRecurType').value;
        let select = document.getElementById('evRecurInterval');
        select.innerHTML = '';
        
        if (type === 'none' || type === 'daily' || type === 'yearly') {
            select.innerHTML = `<option value="1">Standart</option>`;
            select.disabled = true;
        } else if (type === 'weekly') {
            select.disabled = false;
            select.innerHTML = `<option value="1">Her Hafta</option><option value="2">2 Haftada Bir</option><option value="3">3 Haftada Bir</option>`;
        } else if (type === 'monthly') {
            select.disabled = false;
            for(let i=1; i<=11; i++) {
                select.innerHTML += `<option value="${i}">${i} Ayda Bir</option>`;
            }
        }
    }

    // Tarayıcı Bildirim İzni İsteme
    function requestNotificationPermission() {
        if ("Notification" in window) {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") alert("Bildirimlere başarıyla izin verildi!");
            });
        }
    }

    // Etkinlik Kaydetme
    function saveEvent() {
        let subject = document.getElementById('evSubject').value;
        let datetime = document.getElementById('evDateTime').value;
        let preAlarm = document.getElementById('evPreAlarm').value;
        let recurType = document.getElementById('evRecurType').value;
        let recurInterval = document.getElementById('evRecurInterval').value;

        if(!subject || !datetime) { alert("Lütfen konu ve tarih seçiniz!"); return; }

        let newEvent = {
            id: Date.now().toString(),
            subject: subject,
            datetime: datetime, // ISO format: 2026-05-08T14:30
            color: selectedColor,
            preAlarm: parseInt(preAlarm),
            recurType: recurType,
            recurInterval: parseInt(recurInterval),
            snoozedUntil: null,
            isCompleted: false
        };

        events.push(newEvent);
        saveAndRender();
        
        // Formu temizle
        document.getElementById('evSubject').value = '';
        document.getElementById('evDateTime').value = '';
    }

    function deleteEvent(id) {
        if(confirm("Bu alarmı silmek istediğinize emin misiniz?")) {
            events = events.filter(e => e.id !== id);
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('epa_calendar_events', JSON.stringify(events));
        renderAgenda();
    }

    // Ajanda Listesini Ekrana Çizme
    function renderAgenda() {
        let container = document.getElementById('agendaContainer');
        container.innerHTML = '';

        // Sadece tamamlanmamış olanları al ve tarihe göre sırala
        let activeEvents = events.filter(e => !e.isCompleted);
        
        activeEvents.sort((a, b) => new Date(a.datetime) - new Date(b.datetime));

        if(activeEvents.length === 0) {
            container.innerHTML = `<div class="text-center text-muted mt-5"><i class="fa-regular fa-calendar-xmark fa-3x mb-3"></i><br>Yaklaşan bir etkinlik bulunmuyor.</div>`;
            return;
        }

        activeEvents.forEach(ev => {
            let dt = new Date(ev.datetime);
            let dateStr = dt.toLocaleDateString('tr-TR', { day: '2-digit', month: 'short', year: 'numeric' });
            let timeStr = dt.toLocaleTimeString('tr-TR', { hour: '2-digit', minute:'2-digit' });
            
            // Google Calendar Linki Oluşturma
            let endDt = new Date(dt.getTime() + (60*60*1000)); // 1 saatlik
            let formatIso = (date) => date.toISOString().replace(/-|:|\.\d\d\d/g,"");
            let gcalLink = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(ev.subject)}&dates=${formatIso(dt)}/${formatIso(endDt)}`;

            let html = `
            <div class="agenda-item cat-${ev.color}">
                <div style="flex:1;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="agenda-date"><i class="fa-regular fa-calendar"></i> ${dateStr}</span>
                        <span class="agenda-time">${timeStr}</span>
                    </div>
                    <div class="agenda-subject">${ev.subject}</div>
                    <div class="agenda-meta">
                        <span><i class="fa-solid fa-bell"></i> ${ev.preAlarm == 0 ? 'Tam Vaktinde' : ev.preAlarm >= 60 ? (ev.preAlarm/60)+' Saat Önce' : ev.preAlarm+' Dk Önce'}</span>
                        <span><i class="fa-solid fa-arrows-rotate"></i> ${ev.recurType === 'none' ? 'Tekrar Yok' : ev.recurType.toUpperCase()}</span>
                    </div>
                </div>
                <div style="margin-left: 15px; display:flex; flex-direction:column; gap:10px;">
                    <a href="${gcalLink}" target="_blank" class="btn-action gcal" title="Google Takvim'e Ekle"><i class="fa-brands fa-google"></i></a>
                    <button class="btn-action del" onclick="deleteEvent('${ev.id}')" title="Sil"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            </div>`;
            container.innerHTML += html;
        });
    }

    // --- ALARM MOTORU (HER 10 SANİYEDE BİR ÇALIŞIR) ---
    function startAlarmEngine() {
        if(alarmCheckInterval) clearInterval(alarmCheckInterval);
        alarmCheckInterval = setInterval(checkAlarms, 10000);
        checkAlarms(); // İlk açılışta hemen kontrol et
    }

    function checkAlarms() {
        let now = new Date().getTime();

        events.forEach(ev => {
            if (ev.isCompleted) return;

            // Orijinal tetiklenme zamanı = Etkinlik zamanı - Ön uyarı süresi (dk -> ms)
            let triggerTime = new Date(ev.datetime).getTime() - (ev.preAlarm * 60000);
            
            // Eğer ertelenmişse, triggerTime erteleme zamanı olur
            if (ev.snoozedUntil) {
                triggerTime = ev.snoozedUntil;
            }

            // Zamanı geldiyse alarmı çal!
            if (now >= triggerTime && activeAlarmId !== ev.id) {
                triggerAlarm(ev);
            }
        });
    }

    // Tarayıcı Üzerinden Bip Sesi Üretme (Harici dosya kırık link riskini sıfırlar)
    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime); // Tiz nota
            osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.5); // Kalına kay
            gain.gain.setValueAtTime(0.3, ctx.currentTime); // Ses seviyesi
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
        } catch(e) { console.log("Ses çalınamadı."); }
    }

    function triggerAlarm(ev) {
        activeAlarmId = ev.id;
        
        // 1. Ses Çal
        playBeep();

        // 2. Tarayıcı Bildirimi (Push Notification)
        if ("Notification" in window && Notification.permission === "granted") {
            new Notification("EPA Alarmı: " + ev.subject, {
                body: "Planlanmış zamanı geldi: " + new Date(ev.datetime).toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}),
                icon: "https://ykaracabay-source.github.io/emlakasistani/logo.jpg"
            });
        }

        // 3. Ana Sekmeyi Yanıp Söndürmek İçin Ana HTML'ye Sinyal Gönder
        window.parent.postMessage({ type: 'EPA_ALARM_START', subject: ev.subject }, '*');

        // 4. Modalı Ekrana Getir
        document.getElementById('alarmSubject').innerText = ev.subject;
        document.getElementById('alarmTimeText').innerText = "Alarm Zamanı: " + new Date(ev.datetime).toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
        document.getElementById('alarmOverlay').style.display = 'flex';
    }

    // ERTELE (1 SAAT)
    function snoozeAlarm() {
        let evIndex = events.findIndex(e => e.id === activeAlarmId);
        if(evIndex > -1) {
            // Şimdiki zamana + 1 Saat ekle
            events[evIndex].snoozedUntil = new Date().getTime() + (60 * 60 * 1000); 
            saveAndRender();
        }
        closeAlarm();
    }

    // DURDUR VE TEKRARI HESAPLA
    function stopAlarm() {
        let evIndex = events.findIndex(e => e.id === activeAlarmId);
        if(evIndex > -1) {
            let ev = events[evIndex];
            
            if(ev.recurType === 'none') {
                ev.isCompleted = true; // Tekrar etmiyorsa bitir
            } else {
                // Tekrar ediyorsa, tarihi ileri sar
                let currentDt = new Date(ev.datetime);
                if(ev.recurType === 'daily') currentDt.setDate(currentDt.getDate() + 1);
                else if(ev.recurType === 'weekly') currentDt.setDate(currentDt.getDate() + (7 * ev.recurInterval));
                else if(ev.recurType === 'monthly') currentDt.setMonth(currentDt.getMonth() + ev.recurInterval);
                else if(ev.recurType === 'yearly') currentDt.setFullYear(currentDt.getFullYear() + 1);
                
                // Formata geri çevir (YYYY-MM-DDTHH:MM)
                ev.datetime = new Date(currentDt.getTime() - (currentDt.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
                ev.snoozedUntil = null; // Varsa ertelemeyi sıfırla
            }
            saveAndRender();
        }
        closeAlarm();
    }

    function closeAlarm() {
        document.getElementById('alarmOverlay').style.display = 'none';
        activeAlarmId = null;
        // Yanıp sönmeyi durdurmak için Ana HTML'ye sinyal gönder
        window.parent.postMessage({ type: 'EPA_ALARM_STOP' }, '*');
    }

    // Sayfa Yüklendiğinde
    window.onload = function() {
        updateRecurInterval();
        renderAgenda();
        startAlarmEngine();
    };
</script>

</body>
</html>
